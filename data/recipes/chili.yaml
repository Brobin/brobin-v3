title: Chili
description: My simple formula for a long-simmering chili. Makes 10-12 generous servings
tags:
  - main
  - soup
ingredients:
  - 1.5 lbs. ground turkey (chicken or beef works too)
  - 2 yellow onions
  - 2 heads Garlic
  - 2 jalapenos (optional)
  - 5 cans diced tomatoes
  - 5 cans beans (I usually use 2 black, 1 kideny, 1 pinto, 1 chili)
  - 1+ tsp. cayenne pepper
  - 1+ Tbsp chili powder
  - 1 tsp garlic powder
  - 2 tsp salt
method:
  - In a large pot, brown the ground turkey with about a teaspoon of cayenne pepper.
  - Add diced onions, minced garlic, and optional diced jalapenos. Sautee until onions are slightly translucent.
  - Drain the of beans, and add along with the tomatoes and stir.
  - Add 1 Tbsp chili powder (or more to tate), a generous sprinking of garlic powder, and salt.
  - Stir and simmer on medium for an hour, then reduce to medium-low for as long as you like (usually 2-4 hours).
  - Season to taste with more chili powder and cayenne.
